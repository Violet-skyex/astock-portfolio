[theme]
primaryColor        = "#D62828"
backgroundColor     = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor           = "#1A1A2E"
font                = "sans serif"

[server]
headless            = true
enableCORS          = false
enableXsrfProtection = true
maxUploadSize       = 50

[browser]
gatherUsageStats    = false
